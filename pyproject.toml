[project]
name = "plot-digitizer"
version = "0.1.0"
description = "GUI tool for digitizing data points out of chart/plot images"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "pyside6>=6.7",
    "numpy>=2.0",
    "opencv-python-headless>=4.10",
    "pytesseract>=0.3.10",
]

[project.scripts]
plot-digitizer = "plot_digitizer.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest-qt>=4.5.0",
    "matplotlib>=3.11.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/plot_digitizer"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "N"]

[tool.ruff.lint.per-file-ignores]
# Qt event-handler overrides (wheelEvent, ...) and Signal attributes must
# match Qt's camelCase API and can't be renamed to snake_case.
"src/plot_digitizer/gui/*" = ["N802", "N815"]

[tool.mypy]
python_version = "3.12"
disallow_untyped_defs = true
warn_return_any = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = "cv2.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "pytesseract.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "gui: tests that require a Qt display (run headless via QT_QPA_PLATFORM=offscreen)",
]
